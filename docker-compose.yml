services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: unihub-web
    profiles: ["core", "full"]
    ports:
      - "${WEB_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - unihub-network

networks:
  unihub-network:
    name: unihub-network
    driver: bridge
