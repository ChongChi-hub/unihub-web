services:
  web:
    image: ghcr.io/${GHCR_OWNER:-your-github-username}/unihub-web:${IMAGE_TAG:-latest}
    container_name: unihub-web-prod
    profiles: ["core", "full"]
    ports:
      - "${WEB_PORT:-3000}:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unihub-web.rule=Host(`unihub.localhost`)"
      - "traefik.http.routers.unihub-web.entrypoints=web,websecure"
      - "traefik.http.routers.unihub-web.tls=true"
      - "traefik.http.services.unihub-web.loadbalancer.server.port=80"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - unihub-network

networks:
  unihub-network:
    name: unihub-network
    driver: bridge
